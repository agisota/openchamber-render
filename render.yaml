services:
  - type: web
    name: openchamber-01
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: openchamber-01-data
      mountPath: /home/openchamber/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENCHAMBER_HOST
        value: 0.0.0.0
      - key: OPENCHAMBER_DATA_ROOT
        value: /home/openchamber/data
      - key: OPENCHAMBER_REQUIRE_UI_PASSWORD
        value: "true"
      - key: OPENCHAMBER_INSTALL_UPSTREAM_SKILLS
        value: "true"
      - key: OPENCHAMBER_WORKSPACE_INDEX
        value: "01"
      - key: OPENCHAMBER_WORKSPACE_NAME
        value: workspace-01
      - key: OPENCODE_ZED_BASE_URL
        value: https://api.zed.md/v1
      - key: OPENCODE_ZED_PROVIDER_ID
        value: zed
      - key: OPENCODE_ZED_MODEL_ID
        value: deepseek
      - key: OPENCODE_DEFAULT_MODEL
        value: zed/deepseek
      - key: OPENCHAMBER_UI_PASSWORD
        sync: false
      - key: ZED_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false

